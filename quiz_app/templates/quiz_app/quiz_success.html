{% extends 'base.html' %} {% block content %}
<style>
  .success-wrapper {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .success-card {
    background: transparent;
    padding: 45px 40px;
    border-radius: 24px;

    border: 1px solid rgba(59, 130, 246, 0.2);

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.04),
      0 20px 50px rgba(2, 6, 23, 0.4),
      0 0 30px rgba(37, 99, 235, 0.1);

    max-width: 500px;
    width: 100%;
    text-align: center;

    position: relative;
    overflow: hidden;
  }

  .success-card::before {
    content: "";
    position: absolute;
    inset: 0;

    background: radial-gradient(
      circle at top,
      rgba(34, 197, 94, 0.1) 0%,
      rgba(59, 130, 246, 0.06) 40%,
      transparent 70%
    );

    pointer-events: none;
  }

  .success-card > * {
    position: relative;
    z-index: 1;
  }

  .success-icon {
    width: 64px;
    height: 64px;

    background: rgba(34, 197, 94, 0.12);
    color: #4ade80;
    border: 1px solid rgba(34, 197, 94, 0.35);

    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 22px;
    font-size: 30px;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    box-shadow: 0 0 22px rgba(34, 197, 94, 0.25);

    animation: popIn 0.5s ease;
  }

  @keyframes popIn {
    0% {
      transform: scale(0.6);
      opacity: 0;
    }
    70% {
      transform: scale(1.08);
      opacity: 1;
    }
    100% {
      transform: scale(1);
    }
  }

  .success-title {
    font-size: 1.6rem;
    margin-bottom: 10px;
    font-weight: 800;

    background: linear-gradient(to right, #4ade80, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .success-text {
    color: #94a3b8;
    font-size: 14px;
    line-height: 1.6;
  }

  .success-text strong {
    color: #dbeafe;
  }

  .back-btn {
    display: inline-block;
    margin-top: 26px;
    padding: 12px 32px;

    background: rgba(37, 99, 235, 0.14);
    color: #dbeafe;

    border: 1px solid rgba(59, 130, 246, 0.25);
    border-radius: 12px;

    text-decoration: none;
    font-weight: 700;
    font-size: 14px;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    transition: all 0.3s ease;
  }

  .back-btn:hover {
    background: rgba(37, 99, 235, 0.22);
    border-color: rgba(96, 165, 250, 0.5);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 0 18px rgba(59, 130, 246, 0.18);
  }
</style>

<div class="success-wrapper">
  <div class="success-card">
    <div class="success-icon"><i class="fas fa-check-circle"></i> ✓</div>

    <h2 class="success-title">Submission Successful!</h2>

    <p class="success-text">
      <strong>{{ quiz.title }}</strong> Recorded Successfully.<br />
    </p>

    <a href="{% url 'quiz' %}" class="back-btn">Back to Portal</a>
  </div>
</div>
{% endblock %}
