{% extends 'base.html' %} {% block content %}
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
/>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    renderMathInElement(document.body, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false },
        { left: "\\(", right: "\\)", display: false },
        { left: "\\[", right: "\\]", display: true },
      ],
      throwOnError: false,
    });
  });
</script>

<style>
  :root {
    --primary: #6366f1;
    --success: #22c55e;
    --danger: #ef4444;
    --dark: #1e293b;
    --gray: #64748b;
  }

  body {
    font-family:
      "Inter",
      -apple-system,
      sans-serif;
    color: #c9c3ed;
    font-size: 14px;
  }

  .top-bar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(to right, #60a5fa, #818cf8, #f472b6);
    background-size: 200% 100%;
    animation: shimmerBar 4s linear infinite;
    z-index: 1100;
  }

  @keyframes shimmerBar {
    0% {
      background-position: 0% 0;
    }
    100% {
      background-position: 200% 0;
    }
  }

  .timer-box {
    position: fixed;
    top: 80px;
    right: 30px;
    z-index: 1000;

    background: rgba(15, 23, 42, 0.55);
    border: 1px solid rgba(59, 130, 246, 0.3);
    color: #fbbf24;

    padding: 12px 24px;
    border-radius: 14px;

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.04),
      0 10px 30px rgba(2, 6, 23, 0.4),
      0 0 24px rgba(37, 99, 235, 0.15);

    text-align: center;
    transition: all 0.4s ease;
  }

  .timer-box.low-time {
    border-color: rgba(239, 68, 68, 0.5);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.04),
      0 10px 30px rgba(2, 6, 23, 0.4),
      0 0 26px rgba(239, 68, 68, 0.35);
    animation: pulseWarn 1s ease-in-out infinite;
  }

  @keyframes pulseWarn {
    0%,
    100% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.04);
    }
  }

  .timer-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    opacity: 0.85;
    margin-bottom: 3px;
    color: #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }

  .timer-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fbbf24;
    box-shadow: 0 0 6px rgba(251, 191, 36, 0.8);
    animation: pulseDot 1.2s infinite ease-in-out;
  }

  .low-time .timer-dot {
    background: #ef4444;
    box-shadow: 0 0 6px rgba(239, 68, 68, 0.9);
  }

  @keyframes pulseDot {
    0%,
    100% {
      opacity: 1;
      transform: scale(1);
    }
    50% {
      opacity: 0.4;
      transform: scale(0.8);
    }
  }

  .timer-count {
    font-size: 1.4rem;
    font-weight: 800;
    font-family: "Consolas", monospace;
    color: #fbbf24;
    letter-spacing: 1px;
  }

  .low-time .timer-count {
    color: #f87171;
  }

  .quiz-wrapper {
    max-width: 780px;
    margin: 80px auto 100px;
    padding: 0 15px;
  }

  .main-card {
    background: transparent;

    padding: 34px 42px;
    border-radius: 22px;

    border: 1px solid rgba(59, 130, 246, 0.2);

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.04),
      0 16px 40px rgba(2, 6, 23, 0.4);

    position: relative;
    overflow: hidden;
  }

  .main-card::before {
    content: "";
    position: absolute;
    inset: 0;

    background: radial-gradient(
      circle at top,
      rgba(59, 130, 246, 0.12) 0%,
      rgba(99, 102, 241, 0.07) 35%,
      transparent 70%
    );

    pointer-events: none;
  }

  .main-card::after {
    content: "";
    position: absolute;
    top: -60%;
    right: -20%;
    width: 300px;
    height: 300px;
    background: radial-gradient(
      circle,
      rgba(244, 114, 182, 0.12) 0%,
      transparent 70%
    );
    pointer-events: none;
  }

  .main-card > * {
    position: relative;
    z-index: 1;
  }

  .section-titleq {
    font-size: 20px;
    color: #c9c3ed;
    font-weight: 700;
    margin-bottom: 18px;
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-titleq::before {
    content: "";
    width: 4px;
    height: 20px;
    border-radius: 4px;
    background: linear-gradient(to bottom, #60a5fa, #818cf8);
  }

  .section-titleq::after {
    content: "";
    height: 1px;
    background: linear-gradient(to right, rgba(59, 130, 246, 0.3), transparent);
    flex-grow: 1;
  }

  .quiz-header {
    margin-bottom: 40px;
    text-align: center;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(59, 130, 246, 0.15);
  }

  .quiz-title {
    font-size: 1.7rem;
    font-weight: 800;
    margin: 0;

    background: linear-gradient(135deg, #60a5fa, #818cf8, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .quiz-subtitle {
    font-size: 12px;
    color: #70e774;
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  .input-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 30px;
  }

  .modern-input {
    padding: 11px 15px;
    border: 1px solid rgba(59, 130, 246, 0.2);
    border-radius: 9px;
    font-size: 13px;

    background: rgba(37, 99, 235, 0.07);
    color: #dbeafe;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    transition: 0.25s ease;
  }

  .modern-input::placeholder {
    color: #64748b;
  }

  .modern-input:hover {
    border-color: rgba(96, 165, 250, 0.35);
  }

  .modern-input:focus {
    border-color: rgba(96, 165, 250, 0.6);
    outline: none;
    background: rgba(37, 99, 235, 0.12);
    box-shadow: 0 0 14px rgba(59, 130, 246, 0.2);
  }

  .question-box {
    margin-bottom: 22px;
    padding: 22px;
    border-radius: 14px;

    border: 1px solid rgba(59, 130, 246, 0.16);
    background: rgba(37, 99, 235, 0.05);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    transition: all 0.3s ease;
  }

  .question-box:hover {
    border-color: rgba(96, 165, 250, 0.4);
    box-shadow: 0 8px 24px rgba(37, 99, 235, 0.1);
  }

  .q-text {
    font-size: 15px;
    font-weight: 600;
    color: #c9c3ed;
    margin-bottom: 16px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    line-height: 1.5;
  }

  .q-number {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, #6366f1, #818cf8);
    box-shadow: 0 4px 10px rgba(99, 102, 241, 0.35);
  }

  .option-item {
    display: flex;
    align-items: center;
    padding: 11px 16px;

    background: transparent;
    margin-top: 8px;
    border-radius: 10px;
    cursor: pointer;

    border: 1px solid rgba(59, 130, 246, 0.18);

    transition: all 0.2s ease;
    font-size: 13.5px;
    color: #c9c3ed;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .option-item:hover {
    background: rgba(37, 99, 235, 0.12);
    border-color: rgba(96, 165, 250, 0.5);
    color: #fff;
    transform: translateX(3px);
  }

  .option-item:has(input:checked) {
    background: rgba(99, 102, 241, 0.16);
    border-color: rgba(129, 140, 248, 0.6);
    color: #fff;
    box-shadow: 0 0 14px rgba(99, 102, 241, 0.2);
  }

  .option-item input {
    margin-right: 12px;
    accent-color: #818cf8;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .btn-submit {
    width: 100%;
    padding: 15px;

    background: linear-gradient(
      135deg,
      rgba(99, 102, 241, 0.2),
      rgba(244, 114, 182, 0.15)
    );
    color: #fff;

    border: 1px solid rgba(129, 140, 248, 0.35);
    border-radius: 13px;

    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    margin-top: 24px;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    transition: 0.3s ease;
  }

  .btn-submit:hover {
    background: linear-gradient(
      135deg,
      rgba(99, 102, 241, 0.32),
      rgba(244, 114, 182, 0.24)
    );
    border-color: rgba(165, 180, 252, 0.6);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25);
  }

  .btn-submit:active {
    transform: translateY(0);
  }

  @media (max-width: 640px) {
    .input-grid {
      grid-template-columns: 1fr 1fr;
    }
    .quiz-wrapper {
      margin-top: 40px;
    }
    .main-card {
      padding: 22px 16px;
      border-radius: 0;
      border: none;
    }
    .timer-box {
      top: auto;
      bottom: 0;
      right: 0;
      left: 0;
      width: 100%;
      border-radius: 0;
      padding: 10px;
    }
    .btn-submit {
      margin-bottom: 60px;
    }
  }
</style>

<div class="top-bar"></div>

<div class="timer-box" id="timerBox">
  <div class="timer-label"><span class="timer-dot"></span>Time Remaining</div>
  <div id="countdown-timer" class="timer-count">00:00:00</div>
</div>

<div class="quiz-wrapper">
  <div class="main-card">
    <div class="quiz-header">
      <h2 class="quiz-title">{{ quiz.title }}</h2>
      <p class="quiz-subtitle">Quiz · Math Club</p>
    </div>

    <form id="quizForm" method="POST">
      {% csrf_token %}

      <div class="section-titleq">Candidate Information</div>
      <div class="input-grid">
        <input
          type="text"
          name="name"
          class="modern-input"
          placeholder="Full Name"
          required
        />
        <input
          type="text"
          name="student_id"
          class="modern-input"
          placeholder="Student ID"
          required
        />
        <input
          type="email"
          name="uap_mail"
          class="modern-input"
          placeholder="UAP Email"
          required
        />
        <input
          type="text"
          name="dept"
          class="modern-input"
          placeholder="Dept"
          required
        />
        <input
          type="text"
          name="semester"
          class="modern-input"
          placeholder="Semester"
          required
        />
        <input
          type="text"
          name="section"
          class="modern-input"
          placeholder="Section"
          required
        />
      </div>

      <div class="section-titleq">Questions</div>
      {% for q in quiz.questions.all %}
      <div class="question-box">
        <div class="q-text">
          <span class="q-number">{{ forloop.counter }}</span>
          <span>{{ q.text }}</span>
        </div>

        {% if q.image %}
        <div style="margin: 12px 0; text-align: center">
          <img
            src="{{ q.image.url }}"
            style="
              max-width: 100%;
              border-radius: 10px;
              border: 1px solid rgba(59, 130, 246, 0.2);
            "
          />
        </div>
        {% endif %}

        <div class="options-list">
          <label class="option-item">
            <input type="radio" name="q_{{ q.id }}" value="1" />
            <span>{{ q.opt1 }}</span>
          </label>
          <label class="option-item">
            <input type="radio" name="q_{{ q.id }}" value="2" />
            <span>{{ q.opt2 }}</span>
          </label>
          <label class="option-item">
            <input type="radio" name="q_{{ q.id }}" value="3" />
            <span>{{ q.opt3 }}</span>
          </label>
          <label class="option-item">
            <input type="radio" name="q_{{ q.id }}" value="4" />
            <span>{{ q.opt4 }}</span>
          </label>
        </div>
      </div>
      {% endfor %}

      <button type="submit" class="btn-submit" id="submitBtn">
        Submit Examination
      </button>
    </form>
  </div>
</div>

<script>
  const quizEndTime = new Date(
    "{{ quiz.end_time|date:'Y-m-d H:i:s' }}",
  ).getTime();

  const timerX = setInterval(function () {
    const now = new Date().getTime();
    const distance = quizEndTime - now;

    const hours = Math.floor(
      (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
    );
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    const timerDisplay = document.getElementById("countdown-timer");
    const timerBox = document.getElementById("timerBox");

    if (distance < 0) {
      clearInterval(timerX);
      timerDisplay.innerHTML = "TIME UP";
      document.getElementById("quizForm").submit();
    } else {
      timerDisplay.innerHTML =
        (hours < 10 ? "0" + hours : hours) +
        ":" +
        (minutes < 10 ? "0" + minutes : minutes) +
        ":" +
        (seconds < 10 ? "0" + seconds : seconds);

      if (distance < 5 * 60 * 1000) {
        timerBox.classList.add("low-time");
      }
    }
  }, 1000);
</script>
{% endblock %}
